[preset.0.options]

custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=true
html/custom_html_shell=""
html/head_include="<meta name=\"theme-color\" content=\"#1a1612\"><meta name=\"apple-mobile-web-app-capable\" content=\"yes\"><meta name=\"mobile-web-app-capable\" content=\"yes\"><meta name=\"apple-mobile-web-app-status-bar-style\" content=\"black-translucent\"><meta name=\"format-detection\" content=\"telephone=no\"><style>:root{--sat:env(safe-area-inset-top,0px);--sar:env(safe-area-inset-right,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px)}html,body{background:#1a1612;position:fixed;inset:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}#canvas{touch-action:none;-webkit-touch-callout:none}</style><script>(function(){var c='width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover';var v=document.querySelector('meta[name=viewport]');if(v){v.setAttribute('content',c);}else{v=document.createElement('meta');v.name='viewport';v.content=c;document.head.appendChild(v);}function no(e){e.preventDefault();}['gesturestart','gesturechange','gestureend'].forEach(function(t){document.addEventListener(t,no,{passive:false});});document.addEventListener('dblclick',no,{passive:false});document.addEventListener('contextmenu',no);document.addEventListener('touchmove',function(e){if(e.touches.length>1||e.target.id==='canvas'||e.target===document.body){e.preventDefault();}},{passive:false});var last=0;document.addEventListener('touchend',function(e){var n=Date.now();if(n-last<320&&e.target.id==='canvas'){e.preventDefault();}last=n;},{passive:false});})();</script>"
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false

